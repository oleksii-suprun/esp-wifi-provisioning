[package]
name = "esp-wifi-provisioning"
version = "0.1.0"
authors = ["Oleksii Suprun <aleksey.suprun@gmail.com>"]
edition = "2024"

[[bin]]
name = "esp-wifi-provisioning"
harness = false # do not use the built-in cargo test harness -> resolve rust-analyzer errors

[profile.release]
opt-level = "s"

[profile.dev]
debug = true    # Symbols are nice, and they don't increase the size on Flash
opt-level = "z"

[dependencies]
log = "0.4"
esp-idf-svc = "0.53"

[build-dependencies]
embuild = "0.33.5"

[[package.metadata.esp-idf-sys.extra_components]]
remote_component = { name = "espressif/esp_wifi_service", version = "=0.5.3" }
bindings_header = "src/wifi_bindings.h"
